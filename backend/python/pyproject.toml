[project]
name = "ag-ui-copilot-sdk"
version = "0.1.0"
description = "Standalone local CopilotKit/AG-UI demo backed by the GitHub Copilot SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ag-ui-protocol==0.1.22",
    "github-copilot-sdk==1.0.14",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn[standard]>=0.23,<1"]

[project.scripts]
copilot-ag-ui-demo = "server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28", "fastapi>=0.100", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ag_ui_copilot_sdk", "agents"]

[tool.hatch.build.force-include]
"showcase_data" = "showcase_data"

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"showcase_domain.py" = "showcase_domain.py"
"showcases.py" = "showcases.py"
"showcase_data" = "showcase_data"

[tool.uv.sources]
# Pin the public wheel: SDK 1.0.14 is not carried by every mirror.
github-copilot-sdk = { url = "https://files.pythonhosted.org/packages/ed/e2/4d8c622545f55f06773548cf86ffe60f59e6a4cedcc412ff84fcac244b2b/github_copilot_sdk-1.0.14-py3-none-any.whl" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
